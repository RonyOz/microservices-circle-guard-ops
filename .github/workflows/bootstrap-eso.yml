name: Bootstrap ESO

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target namespace
        type: choice
        options: [dev, stage, production]
        default: dev

env:
  AWS_REGION: us-east-1
  # Account-agnostic: the ARN is built at runtime from the OIDC-assumed identity
  # (see "Resolve ESO role ARN" step). Role name matches var.role_name in
  # terraform/aws/modules/irsa-secrets — same pattern deploy-dev.yml uses for the registry.
  ESO_ROLE_NAME: circleguard-eso-role

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name circleguard-eks --region ${{ env.AWS_REGION }}

      - name: Resolve ESO role ARN
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ESO_ROLE_ARN=arn:aws:iam::${ACCOUNT_ID}:role/${ESO_ROLE_NAME}" >> "$GITHUB_ENV"
          echo "Resolved ESO_ROLE_ARN for account ${ACCOUNT_ID}"

      - name: Install external-secrets-operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ env.ESO_ROLE_ARN }} \
            --wait --timeout 3m

      - name: Create ClusterSecretStore
        run: |
          kubectl apply -f - <<EOF
          apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          metadata:
            name: circleguard-secret-store
          spec:
            provider:
              aws:
                service: SecretsManager
                region: us-east-1
                auth:
                  jwt:
                    serviceAccountRef:
                      name: external-secrets
                      namespace: external-secrets
          EOF

      - name: Seed Secrets Manager secret
        run: |
          SECRET_NAME="circleguard/${ENVIRONMENT}"
          CURRENT=$(aws secretsmanager get-secret-value --secret-id "$SECRET_NAME" --query SecretString --output text 2>/dev/null || echo "")
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_NAME" \
              --secret-string "{\"DB_USERNAME\":\"circleguard\",\"DB_PASSWORD\":\"${{ secrets.DB_PASSWORD }}\",\"NEO4J_USERNAME\":\"neo4j\",\"NEO4J_PASSWORD\":\"${{ secrets.DB_PASSWORD }}\",\"JWT_SECRET\":\"${{ secrets.JWT_SECRET }}\"}"
            echo "Seeded SM secret $SECRET_NAME"
          else
            echo "SM secret $SECRET_NAME already has a value — skipping seed"
          fi

      - name: Create ExternalSecrets
        run: |
          NS="${ENVIRONMENT}"
          for SVC in auth-service identity-service promotion-service notification-service form-service gateway-service dashboard-service file-service; do
            kubectl apply -f - <<EOF
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ${SVC}-external-secret
            namespace: ${NS}
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: circleguard-secret-store
              kind: ClusterSecretStore
            target:
              name: ${SVC}-secret
              creationPolicy: Owner
            dataFrom:
              - extract:
                  key: circleguard/${NS}
          EOF
          done

      - name: Verify sync
        run: |
          sleep 15
          kubectl get externalsecret -n ${{ env.ENVIRONMENT }}
