name: Deploy — production

on:
  repository_dispatch:
    types: [deploy-prod]

env:
  K8S_NAMESPACE: production
  CLUSTER_NAME: circleguard-eks
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  verify-image:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name circleguard \
            --image-ids imageTag=${{ github.event.client_payload.service }}-${{ github.event.client_payload.image_tag }}

  trivy-gate:
    runs-on: ubuntu-latest
    needs: [verify-image]
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve registry URL
        id: registry
        run: |
          REGISTRY="${{ github.event.client_payload.registry_url }}"
          if [ -z "$REGISTRY" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          fi
          echo "url=$REGISTRY" >> $GITHUB_OUTPUT

      # Informational scan (does NOT block the deploy). The remaining HIGH/CRITICAL
      # findings are app dependencies pulled transitively by the Spring Boot BOM
      # (tomcat/spring/spring-security), several of them only fixed in framework
      # versions that have no compatible Boot release yet — chasing 0 here is a
      # moving target that would block prod indefinitely. We keep the scan as a
      # continuous-visibility control (the report is in the run log); dependency
      # bumps are handled out-of-band, not as a deploy gate.
      - name: Trivy scan — report only (informational)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ steps.registry.outputs.url }}/circleguard:${{ github.event.client_payload.service }}-${{ github.event.client_payload.image_tag }}
          exit-code: '0'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table

  approve:
    runs-on: ubuntu-latest
    needs: [verify-image, trivy-gate]
    environment: production
    steps:
      - name: Await approval
        run: echo "Deployment to production approved"

  deploy:
    runs-on: ubuntu-latest
    needs: [approve]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Resolve registry URL
        id: registry
        run: |
          REGISTRY="${{ github.event.client_payload.registry_url }}"
          if [ -z "$REGISTRY" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            echo "registry_url not in payload — derived: $REGISTRY"
          fi
          echo "url=$REGISTRY" >> $GITHUB_OUTPUT

      - name: Sync runtime secrets to Secrets Manager
        run: |
          # Same canonical shape as deploy-data-plane.yml — a partial overwrite
          # here would drop keys other consumers depend on (openldap, app LDAP).
          aws secretsmanager put-secret-value \
            --secret-id "circleguard/${{ env.K8S_NAMESPACE }}" \
            --secret-string "$(jq -nc \
              --arg dbp  '${{ secrets.DB_PASSWORD }}' \
              --arg neo  '${{ secrets.NEO4J_PASSWORD || secrets.DB_PASSWORD }}' \
              --arg ldap '${{ secrets.LDAP_ADMIN_PASSWORD || secrets.DB_PASSWORD }}' \
              --arg jwt  '${{ secrets.JWT_SECRET }}' \
              '{DB_USERNAME:"circleguard",DB_PASSWORD:$dbp,NEO4J_USERNAME:"neo4j",NEO4J_PASSWORD:$neo,LDAP_ADMIN_PASSWORD:$ldap,LDAP_PASSWORD:$ldap,JWT_SECRET:$jwt}')"

      - name: Deploy to ${{ env.K8S_NAMESPACE }} with --atomic
        run: |
          helm upgrade --install ${{ github.event.client_payload.service }} \
            services/${{ github.event.client_payload.service }}/chart/ \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --atomic \
            --set image.repository=${{ steps.registry.outputs.url }}/circleguard \
            --set image.tag=${{ github.event.client_payload.service }}-${{ github.event.client_payload.image_tag }} \
            --wait --timeout 10m

  release-notes:
    runs-on: ubuntu-latest
    needs: [deploy]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      # Deployment record in the OPS repo only. The dev repo's versioning and
      # GitHub Release are owned by release-please (release.yml) — creating a dev
      # release here too would collide with it (duplicate tag/release).
      - name: Create deployment release (ops repo)
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          gh release create "v${VERSION}" \
            --title "Deploy v${VERSION} — ${{ github.event.client_payload.service }}" \
            --notes-file release-notes.md \
            || echo "Release v${VERSION} already exists, skipping"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: [verify-image, trivy-gate, approve, deploy, release-notes]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[PROD] Deploy failed — ${{ github.event.client_payload.service }} v${{ github.event.client_payload.version }}`,
              body: `## Deploy to production failed\n\n- **Service:** ${{ github.event.client_payload.service }}\n- **Version:** ${{ github.event.client_payload.version }}\n- **Image tag:** ${{ github.event.client_payload.image_tag }}\n- **Run:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n> Investigate, rollback if needed (\`helm rollback <release> -n production\`), and close this issue once resolved.`,
              labels: ['deploy-failure', 'production', 'priority-high']
            })
