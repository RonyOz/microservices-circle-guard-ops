name: Provision AWS (Terraform)

# Control plane / AWS resources only: VPC, EKS, ECR, GitHub OIDC, IRSA.
# Backing services (Postgres, Neo4j, Kafka, Redis, SMTP, ...) are the DATA PLANE
# and live in deploy-data-plane.yml — keep the two separate to avoid ambiguity.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform
        type: choice
        options: [apply, plan, destroy]
        default: plan

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform/aws

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      # Single shared EKS cluster — environments are K8s namespaces (dev/stage/production),
      # not separate Terraform states. No workspaces: one cluster, one state, one tfvars.
      - name: Terraform plan
        run: |
          terraform plan -var-file=terraform.tfvars -out=tfplan

      - name: Terraform apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply tfplan

      - name: Terraform destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        # Full teardown. The OIDC session token is already issued and survives the
        # role deletion (AWS does not revoke active sessions), so destroy completes.
        # The S3 state bucket is NOT managed by Terraform, so it survives — but to
        # re-provision afterwards you must re-run bootstrap.sh locally (it recreates
        # the GHA role that CI authenticates with). Same step 0 as a fresh account.
        run: |
          terraform destroy -auto-approve -var-file=terraform.tfvars
