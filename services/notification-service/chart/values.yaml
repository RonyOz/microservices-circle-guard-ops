replicaCount: 1

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8085"
  prometheus.io/path: /actuator/prometheus

image:
  repository: ""  # set at deploy time by GHA: --set image.repository=<registry>/circleguard
  pullPolicy: IfNotPresent
  tag: ""  # Overridden by pipeline: --set image.tag=<service>-sha-<commit>

service:
  type: ClusterIP
  port: 8085

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8085
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8085
  initialDelaySeconds: 0
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8085
  initialDelaySeconds: 20
  periodSeconds: 5

env:
  JAVA_TOOL_OPTIONS: "-Xmx192m -Xms128m -XX:+UseContainerSupport"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

envFrom:
  - secretRef:
      name: notification-service-secret
      # Keys expected: JWT_SECRET
