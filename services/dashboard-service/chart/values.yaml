replicaCount: 1

image:
  repository: ""  # set at deploy time by GHA: --set image.repository=<registry>/circleguard
  pullPolicy: IfNotPresent
  tag: ""  # Overridden by pipeline: --set image.tag=<service>-sha-<commit>

service:
  type: ClusterIP
  port: 8087

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

startupProbe:
  tcpSocket:
    port: 8087
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 12

livenessProbe:
  tcpSocket:
    port: 8087
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  tcpSocket:
    port: 8087
  initialDelaySeconds: 20
  periodSeconds: 5

env:
  DB_HOST: "postgres"
  DB_NAME: "circleguard_dashboard"
  PROMOTION_SERVICE_URL: "http://promotion-service:8086"
  FEATURE_KANONYMITY_ENABLED: "true"

envFrom:
  - secretRef:
      name: dashboard-service-secret
      # Keys expected: DB_USERNAME, DB_PASSWORD
