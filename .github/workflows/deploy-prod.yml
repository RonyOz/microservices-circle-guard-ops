name: Deploy — production

on:
  repository_dispatch:
    types: [deploy-prod]

env:
  K8S_NAMESPACE: production
  CLUSTER_NAME: circleguard-eks
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  verify-image:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name circleguard \
            --image-ids imageTag=${{ github.event.client_payload.service }}-${{ github.event.client_payload.image_tag }}

  approve:
    runs-on: ubuntu-latest
    needs: [verify-image]
    environment: production
    steps:
      - name: Await approval
        run: echo "Deployment to production approved"

  deploy:
    runs-on: ubuntu-latest
    needs: [approve]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Resolve registry URL
        id: registry
        run: |
          REGISTRY="${{ github.event.client_payload.registry_url }}"
          if [ -z "$REGISTRY" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            echo "registry_url not in payload — derived: $REGISTRY"
          fi
          echo "url=$REGISTRY" >> $GITHUB_OUTPUT

      - name: Sync runtime secrets to Secrets Manager
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "circleguard/${{ env.K8S_NAMESPACE }}" \
            --secret-string "{\"DB_USERNAME\":\"circleguard\",\"DB_PASSWORD\":\"${{ secrets.DB_PASSWORD }}\",\"NEO4J_USERNAME\":\"neo4j\",\"NEO4J_PASSWORD\":\"${{ secrets.DB_PASSWORD }}\",\"JWT_SECRET\":\"${{ secrets.JWT_SECRET }}\"}"

      - name: Deploy to ${{ env.K8S_NAMESPACE }} with --atomic
        run: |
          helm upgrade --install ${{ github.event.client_payload.service }} \
            services/${{ github.event.client_payload.service }}/chart/ \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --atomic \
            --set image.repository=${{ steps.registry.outputs.url }}/circleguard \
            --set image.tag=${{ github.event.client_payload.service }}-${{ github.event.client_payload.image_tag }} \
            --wait --timeout 10m

  release-notes:
    runs-on: ubuntu-latest
    needs: [deploy]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: release-notes.md

      - name: Create GitHub Release
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            --target ${{ github.event.client_payload.git_commit }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
