replicaCount: 1

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8083"
  prometheus.io/path: /actuator/prometheus

image:
  repository: ""  # set at deploy time by GHA: --set image.repository=<registry>/circleguard
  pullPolicy: IfNotPresent
  tag: ""  # Overridden by pipeline: --set image.tag=<service>-sha-<commit>

service:
  type: ClusterIP
  port: 8083

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8083
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8083
  initialDelaySeconds: 0
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8083
  initialDelaySeconds: 20
  periodSeconds: 5

env:
  JAVA_TOOL_OPTIONS: "-Xmx192m -Xms128m -XX:+UseContainerSupport"
  REDIS_HOST: "redis"
  # Rate Limiting — External Configuration Store pattern (tunable without image rebuild)
  RATE_LIMIT_REQUESTS_PER_WINDOW: "60"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  QR_EXPIRATION_SECONDS: "300"

envFrom:
  - secretRef:
      name: gateway-service-secret
      # Keys expected: JWT_SECRET

# Ingress — disabled by default; enable in prod with certificateArn and host override:
#   helm upgrade ... --set ingress.enabled=true \
#                    --set ingress.host=gateway.circleguard.edu \
#                    --set ingress.certificateArn=arn:aws:acm:<region>:<account>:certificate/<id>
ingress:
  enabled: false
  host: ""
  certificateArn: ""
  annotations: {}
