{{- if .Values.externalSecrets.enabled }}
{{- $path := .Values.externalSecrets.smSecretPath }}
{{- $store := .Values.externalSecrets.secretStoreName }}
{{- $ns := .Release.Namespace }}
{{- /* App services: copy the whole SM secret verbatim (keys == Spring env vars). */}}
{{- range .Values.externalSecrets.appServices }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ . }}-external-secret
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ . }}-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $path }}
{{- end }}
---
{{- /* postgres: container reads key `password`. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-external-secret
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ $path }}
        property: DB_PASSWORD
---
{{- /* openldap: container reads key `admin-password`. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openldap-external-secret
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: openldap-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: {{ $path }}
        property: LDAP_ADMIN_PASSWORD
---
{{- /* neo4j: container reads key `NEO4J_AUTH` with composed value neo4j/<password>. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: neo4j-external-secret
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: neo4j-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEO4J_AUTH: "neo4j/{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $path }}
        property: NEO4J_PASSWORD
{{- end }}
