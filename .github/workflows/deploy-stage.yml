name: Deploy — stage

on:
  repository_dispatch:
    types: [deploy-stage]

env:
  K8S_NAMESPACE: stage
  CLUSTER_NAME: circleguard-eks
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Resolve registry URL
        id: registry
        run: |
          REGISTRY="${{ github.event.client_payload.registry_url }}"
          if [ -z "$REGISTRY" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            echo "registry_url not in payload — derived: $REGISTRY"
          fi
          echo "url=$REGISTRY" >> $GITHUB_OUTPUT

      - name: Sync runtime secrets to Secrets Manager
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "circleguard/${{ env.K8S_NAMESPACE }}" \
            --secret-string "{\"DB_USERNAME\":\"circleguard\",\"DB_PASSWORD\":\"${{ secrets.DB_PASSWORD }}\",\"NEO4J_USERNAME\":\"neo4j\",\"NEO4J_PASSWORD\":\"${{ secrets.DB_PASSWORD }}\",\"JWT_SECRET\":\"${{ secrets.JWT_SECRET }}\"}"

      - name: Helm lint
        run: |
          helm lint services/${{ github.event.client_payload.service }}/chart/

      - name: Deploy to ${{ env.K8S_NAMESPACE }}
        run: |
          helm upgrade --install ${{ github.event.client_payload.service }} \
            services/${{ github.event.client_payload.service }}/chart/ \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ steps.registry.outputs.url }}/circleguard \
            --set image.tag=${{ github.event.client_payload.service }}-${{ github.event.client_payload.image_tag }} \
            --wait --timeout 5m

      - name: Port-forward service for tests
        run: |
          SERVICE="${{ github.event.client_payload.service }}"
          SVC_PORT=$(kubectl get svc "$SERVICE" -n "$K8S_NAMESPACE" -o jsonpath='{.spec.ports[0].port}')
          kubectl port-forward -n "$K8S_NAMESPACE" "svc/$SERVICE" "18080:$SVC_PORT" &
          echo $! > /tmp/pf.pid
          # wait for port-forward to be ready
          for i in $(seq 1 15); do
            curl -sf http://localhost:18080/actuator/health && break || sleep 2
          done

      - name: E2E tests
        run: |
          if [ -f "e2e/${{ github.event.client_payload.service }}/e2e.sh" ]; then
            chmod +x e2e/${{ github.event.client_payload.service }}/e2e.sh
            ./e2e/${{ github.event.client_payload.service }}/e2e.sh
          fi

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:18080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'
          artifact_name: zap-report-${{ github.event.client_payload.service }}
        continue-on-error: true

      - name: Locust performance test
        if: ${{ hashFiles(format('locust/{0}/locustfile.py', github.event.client_payload.service)) != '' }}
        run: |
          pip install locust
          locust -f locustfile.py \
            --headless -u 5 -r 1 --run-time 30s \
            --host http://localhost:18080 \
            --html locust-report.html
        working-directory: locust/${{ github.event.client_payload.service }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.event.client_payload.service }}-${{ github.run_id }}
          path: |
            locust/${{ github.event.client_payload.service }}/locust-report.html
          if-no-files-found: ignore

      - name: Cross-service E2E flows
        run: |
          NS="${{ env.K8S_NAMESPACE }}"
          declare -A SVCS=([auth-service]=18081 [identity-service]=18082 [form-service]=18085 [gateway-service]=18086 [dashboard-service]=18087)
          PF_PIDS=()
          for SVC in "${!SVCS[@]}"; do
            LOCAL="${SVCS[$SVC]}"
            if kubectl get svc "$SVC" -n "$NS" &>/dev/null; then
              SVCPORT=$(kubectl get svc "$SVC" -n "$NS" -o jsonpath='{.spec.ports[0].port}')
              kubectl port-forward -n "$NS" "svc/$SVC" "${LOCAL}:${SVCPORT}" &>/dev/null &
              PF_PIDS+=($!)
            fi
          done
          sleep 5
          for SVC in "${!SVCS[@]}"; do
            LOCAL="${SVCS[$SVC]}"
            for i in $(seq 1 6); do
              curl -sf "http://localhost:${LOCAL}/actuator/health" &>/dev/null && break || sleep 2
            done
          done
          chmod +x e2e/cross-service/e2e.sh
          AUTH_URL=http://localhost:18081 \
          IDENTITY_URL=http://localhost:18082 \
          FORM_URL=http://localhost:18085 \
          GATEWAY_URL=http://localhost:18086 \
          DASHBOARD_URL=http://localhost:18087 \
          ./e2e/cross-service/e2e.sh
          for pid in "${PF_PIDS[@]}"; do kill "$pid" 2>/dev/null || true; done
        continue-on-error: true

      - name: Stop port-forward
        if: always()
        run: kill $(cat /tmp/pf.pid) 2>/dev/null || true

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[STAGE] Deploy failed — ${{ github.event.client_payload.service }}`,
              body: `## Deploy to stage failed\n\n- **Service:** ${{ github.event.client_payload.service }}\n- **Image tag:** ${{ github.event.client_payload.image_tag }}\n- **Run:** [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nInvestigate and close this issue once resolved.`,
              labels: ['deploy-failure', 'stage']
            })
