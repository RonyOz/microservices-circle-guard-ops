name: Bootstrap ESO

# CLUSTER-LEVEL, run ONCE per cluster. Sets up the external-secrets plumbing that
# is shared by every namespace:
#   - external-secrets-operator (Helm, namespace external-secrets)
#   - ClusterSecretStore "circleguard-secret-store" (cluster-scoped singleton)
#
# It deliberately does NOT touch any application namespace:
#   - Per-service ExternalSecrets are created by the data plane (chart circleguard-infra,
#     template external-secrets.yaml) via deploy-data-plane.yml — they are namespaced.
#   - Secrets Manager seeding is done per environment by deploy-dev/stage/prod.yml.
# Keeping those out of here avoids dual ownership of the same resources.

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  # Account-agnostic: the ARN is built at runtime from the OIDC-assumed identity
  # (see "Resolve ESO role ARN" step). Role name matches var.role_name in
  # terraform/aws/modules/irsa-secrets — same pattern deploy-dev.yml uses for the registry.
  ESO_ROLE_NAME: circleguard-eso-role

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name circleguard-eks --region ${{ env.AWS_REGION }}

      - name: Resolve ESO role ARN
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ESO_ROLE_ARN=arn:aws:iam::${ACCOUNT_ID}:role/${ESO_ROLE_NAME}" >> "$GITHUB_ENV"
          echo "Resolved ESO_ROLE_ARN for account ${ACCOUNT_ID}"

      - name: Install external-secrets-operator
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ env.ESO_ROLE_ARN }} \
            --wait --timeout 3m

      - name: Create ClusterSecretStore
        run: |
          kubectl apply -f - <<EOF
          apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          metadata:
            name: circleguard-secret-store
          spec:
            provider:
              aws:
                service: SecretsManager
                region: us-east-1
                auth:
                  jwt:
                    serviceAccountRef:
                      name: external-secrets
                      namespace: external-secrets
          EOF

      - name: Verify ClusterSecretStore
        run: |
          kubectl get clustersecretstore circleguard-secret-store -o wide
