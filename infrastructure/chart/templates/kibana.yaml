{{- if .Values.kibana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    app: kibana
    circleguard/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: "{{ .Values.kibana.image }}:{{ .Values.kibana.tag }}"
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: NODE_OPTIONS
              value: "--max-old-space-size=350"
          ports:
            - containerPort: 5601
          resources:
            {{- toYaml .Values.kibana.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    app: kibana
    circleguard/component: observability
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601
{{- end }}
