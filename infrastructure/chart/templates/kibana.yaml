{{- if .Values.kibana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels:
    app: kibana
    circleguard/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: "{{ .Values.kibana.image }}:{{ .Values.kibana.tag }}"
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch:9200
            - name: NODE_OPTIONS
              value: "--max-old-space-size=350"
          ports:
            - containerPort: 5601
          resources:
            {{- toYaml .Values.kibana.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  labels:
    app: kibana
    circleguard/component: observability
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601

---
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-setup
  labels:
    app: kibana-setup
    circleguard/component: observability
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kibana-setup
          image: curlimages/curl:8.6.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              KIBANA="http://kibana:5601"
              echo "Waiting for Kibana..."
              until curl -sf "$KIBANA/api/status" | grep -q '"level":"available"'; do
                sleep 10
              done
              echo "Kibana ready. Creating index pattern..."
              curl -sf -X POST "$KIBANA/api/saved_objects/index-pattern/circleguard-logs-*" \
                -H "kbn-xsrf: true" \
                -H "Content-Type: application/json" \
                -d '{"attributes":{"title":"circleguard-logs-*","timeFieldName":"@timestamp"}}' || true
              echo "Creating logs-per-service dashboard..."
              curl -sf -X POST "$KIBANA/api/saved_objects/_import?overwrite=true" \
                -H "kbn-xsrf: true" \
                -F file=@/setup/dashboard.ndjson || true
              echo "Kibana setup complete."
          volumeMounts:
            - name: setup-files
              mountPath: /setup
      volumes:
        - name: setup-files
          configMap:
            name: kibana-setup-files
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-setup-files
  labels:
    app: kibana-setup
    circleguard/component: observability
data:
  dashboard.ndjson: |
    {"type": "visualization", "id": "cg-logs-by-service", "attributes": {"title": "CircleGuard \u2014 Logs by Service", "visState": "{\"title\": \"Logs by Service\", \"type\": \"histogram\", \"params\": {\"type\": \"histogram\", \"grid\": {\"categoryLines\": false}, \"categoryAxes\": [{\"id\": \"CategoryAxis-1\", \"type\": \"category\", \"position\": \"bottom\", \"show\": true, \"scale\": {\"type\": \"linear\"}, \"labels\": {\"show\": true, \"truncate\": 100}, \"title\": {}}], \"valueAxes\": [{\"id\": \"ValueAxis-1\", \"name\": \"LeftAxis-1\", \"type\": \"value\", \"position\": \"left\", \"show\": true, \"scale\": {\"type\": \"linear\", \"mode\": \"normal\"}, \"labels\": {\"show\": true, \"rotate\": 0, \"filter\": false, \"truncate\": 100}, \"title\": {\"text\": \"Count\"}}], \"seriesParams\": [{\"show\": true, \"type\": \"histogram\", \"mode\": \"stacked\", \"data\": {\"label\": \"Count\", \"id\": \"1\"}, \"valueAxis\": \"ValueAxis-1\", \"drawLinesBetweenPoints\": true, \"showCircles\": true}], \"addTooltip\": true, \"addLegend\": true, \"legendPosition\": \"right\", \"times\": [], \"addTimeMarker\": false}, \"aggs\": [{\"id\": \"1\", \"enabled\": true, \"type\": \"count\", \"schema\": \"metric\", \"params\": {}}, {\"id\": \"2\", \"enabled\": true, \"type\": \"date_histogram\", \"schema\": \"segment\", \"params\": {\"field\": \"@timestamp\", \"interval\": \"auto\", \"min_doc_count\": 1}}, {\"id\": \"3\", \"enabled\": true, \"type\": \"terms\", \"schema\": \"group\", \"params\": {\"field\": \"service\", \"size\": 10, \"order\": \"desc\", \"orderBy\": \"1\"}}]}", "uiStateJSON": "{}", "description": "Log count per CircleGuard service over time", "version": 1, "kibanaSavedObjectMeta": {"searchSourceJSON": "{\"index\": \"circleguard-logs-*\", \"query\": {\"query\": \"\", \"language\": \"lucene\"}, \"filter\": []}"}}, "references": []}
    {"type": "visualization", "id": "cg-log-levels", "attributes": {"title": "CircleGuard \u2014 Log Levels Distribution", "visState": "{\"title\": \"Log Levels\", \"type\": \"pie\", \"params\": {\"type\": \"pie\", \"addTooltip\": true, \"addLegend\": true, \"legendPosition\": \"right\", \"isDonut\": true}, \"aggs\": [{\"id\": \"1\", \"enabled\": true, \"type\": \"count\", \"schema\": \"metric\", \"params\": {}}, {\"id\": \"2\", \"enabled\": true, \"type\": \"terms\", \"schema\": \"segment\", \"params\": {\"field\": \"level\", \"size\": 5, \"order\": \"desc\", \"orderBy\": \"1\"}}]}", "uiStateJSON": "{}", "description": "Log level distribution across all services", "version": 1, "kibanaSavedObjectMeta": {"searchSourceJSON": "{\"index\": \"circleguard-logs-*\", \"query\": {\"query\": \"\", \"language\": \"lucene\"}, \"filter\": []}"}}, "references": []}
    {"type": "dashboard", "id": "cg-logs-dashboard", "attributes": {"title": "CircleGuard \u2014 Logs per Service", "hits": 0, "description": "Log monitoring dashboard for all CircleGuard microservices", "panelsJSON": "[{\"panelIndex\": \"1\", \"gridData\": {\"x\": 0, \"y\": 0, \"w\": 24, \"h\": 15, \"i\": \"1\"}, \"version\": \"7.0.0\", \"type\": \"visualization\", \"id\": \"cg-logs-by-service\"}, {\"panelIndex\": \"2\", \"gridData\": {\"x\": 24, \"y\": 0, \"w\": 24, \"h\": 15, \"i\": \"2\"}, \"version\": \"7.0.0\", \"type\": \"visualization\", \"id\": \"cg-log-levels\"}]", "optionsJSON": "{\"darkTheme\": false}", "uiStateJSON": "{}", "version": 1, "timeRestore": false, "kibanaSavedObjectMeta": {"searchSourceJSON": "{\"query\": {\"language\": \"lucene\", \"query\": \"\"}, \"filter\": []}"}}, "references": [{"id": "cg-logs-by-service", "name": "panel_1", "type": "visualization"}, {"id": "cg-log-levels", "name": "panel_2", "type": "visualization"}]}
{{- end }}
