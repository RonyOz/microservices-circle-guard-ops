replicaCount: 1

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8088"
  prometheus.io/path: /actuator/prometheus

image:
  repository: ""  # set at deploy time by GHA: --set image.repository=<registry>/circleguard
  pullPolicy: IfNotPresent
  tag: ""  # Overridden by pipeline: --set image.tag=<service>-sha-<commit>

service:
  type: ClusterIP
  port: 8088

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

startupProbe:
  tcpSocket:
    port: 8088
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 12

livenessProbe:
  tcpSocket:
    port: 8088
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  tcpSocket:
    port: 8088
  initialDelaySeconds: 20
  periodSeconds: 5

env:
  JAVA_TOOL_OPTIONS: "-Xmx192m -Xms128m -XX:+UseContainerSupport"
  AWS_REGION: "us-east-1"
  S3_BUCKET: "circleguard-files"

envFrom:
  - secretRef:
      name: file-service-secret
      # Keys expected: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (or use IRSA — preferred)
