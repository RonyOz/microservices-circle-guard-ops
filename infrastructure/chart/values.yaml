# Defaults compartidos por dev/stage/production.
# Para overrides por ambiente, usar `helm install -f values-<env>.yaml`.

postgres:
  image: postgres
  tag: 16-alpine
  storage: 2Gi

neo4j:
  image: neo4j
  tag: 5.26-community
  storage: 2Gi
  heapSize: 256m
  pageCacheSize: 128m

persistence:
  # Use the default EKS StorageClass (gp2) so dynamically-provisioned EBS
  # volumes are removed with the PVC/PV lifecycle.
  storageClassName: gp2
  pvcRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete

zookeeper:
  image: confluentinc/cp-zookeeper
  tag: 7.6.0

kafka:
  image: confluentinc/cp-kafka
  tag: 7.6.0

redis:
  image: redis
  tag: 7.2-alpine

openldap:
  image: osixia/openldap
  tag: 1.5.0
  organisation: CircleGuard
  domain: circleguard.edu

# SMTP capturador para notification-service. No envía correos reales —
# expone una UI web en puerto 8025 para inspeccionar lo que se "enviaría".
mailhog:
  image: mailhog/mailhog
  tag: v1.0.1

# This chart only creates the namespaced ExternalSecret objects (templates/external-secrets.yaml).
# The cluster-scoped ClusterSecretStore referenced below is created once by bootstrap-eso.yml
# (run before this chart) — NOT here, to avoid two owners of a single cluster-wide resource.
externalSecrets:
  enabled: true
  secretStoreName: circleguard-secret-store  # must match the store created by bootstrap-eso.yml
  smSecretPath: ""  # set at deploy time: --set externalSecrets.smSecretPath=circleguard/<namespace>
  # App services: SM keys == Spring env var names → verbatim extract (envFrom: secretRef).
  appServices:
    - auth-service
    - identity-service
    - promotion-service
    - notification-service
    - form-service
    - gateway-service
    - dashboard-service
    - file-service
  # postgres/openldap/neo4j use image-specific keys (+ neo4j a composed value):
  # mapped explicitly in templates/external-secrets.yaml, not via this list.

rbac:
  ghaRoleArn: ""  # set at deploy time: --set rbac.ghaRoleArn=arn:aws:iam::<account>:role/circleguard-gha-role

prometheus:
  enabled: true
  image: prom/prometheus
  tag: v2.51.2
  retention: 15d
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: true
  image: prom/alertmanager
  tag: v0.27.0
  # Alerts are delivered by email to the in-cluster MailHog (smtp 1025, UI :8025)
  smtpSmarthost: "mailhog:1025"
  smtpFrom: "alertmanager@circleguard.edu"
  emailTo: "oncall@circleguard.edu"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

grafana:
  enabled: true
  image: grafana/grafana
  tag: 10.4.2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  adminPassword: circleguard-admin

jaeger:
  enabled: true
  image: jaegertracing/all-in-one
  tag: 1.57.0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

elasticsearch:
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch
  tag: 8.13.4
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

kibana:
  enabled: true
  image: docker.elastic.co/kibana/kibana
  tag: 8.13.4
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

filebeat:
  enabled: true
  image: docker.elastic.co/beats/filebeat
  tag: 8.13.4
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

sonarqube:
  enabled: false
  image: sonarqube
  tag: lts-community
  storage: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
