name: Deploy — stage

on:
  repository_dispatch:
    types: [deploy-stage]

env:
  K8S_NAMESPACE: stage
  CLUSTER_NAME: circleguard-eks
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Resolve registry URL
        id: registry
        run: |
          REGISTRY="${{ github.event.client_payload.registry_url }}"
          if [ -z "$REGISTRY" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            echo "registry_url not in payload — derived: $REGISTRY"
          fi
          echo "url=$REGISTRY" >> $GITHUB_OUTPUT

      - name: Sync runtime secrets to Secrets Manager
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "circleguard/${{ env.K8S_NAMESPACE }}" \
            --secret-string "{\"DB_USERNAME\":\"circleguard\",\"DB_PASSWORD\":\"${{ secrets.DB_PASSWORD }}\",\"NEO4J_USERNAME\":\"neo4j\",\"NEO4J_PASSWORD\":\"${{ secrets.DB_PASSWORD }}\",\"JWT_SECRET\":\"${{ secrets.JWT_SECRET }}\"}"

      - name: Helm lint
        run: |
          helm lint services/${{ github.event.client_payload.service }}/chart/

      - name: Deploy to ${{ env.K8S_NAMESPACE }}
        run: |
          helm upgrade --install ${{ github.event.client_payload.service }} \
            services/${{ github.event.client_payload.service }}/chart/ \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set image.repository=${{ steps.registry.outputs.url }}/circleguard \
            --set image.tag=${{ github.event.client_payload.service }}-${{ github.event.client_payload.image_tag }} \
            --wait --timeout 5m

      - name: E2E tests
        run: |
          if [ -f "e2e/${{ github.event.client_payload.service }}/e2e.sh" ]; then
            chmod +x e2e/${{ github.event.client_payload.service }}/e2e.sh
            ./e2e/${{ github.event.client_payload.service }}/e2e.sh
          fi

      - name: Locust performance test
        if: ${{ hashFiles(format('locust/{0}/locustfile.py', github.event.client_payload.service)) != '' }}
        run: |
          pip install locust
          locust -f locust/locustfile.py \
            --headless -u 5 -r 1 --run-time 30s \
            --host http://${{ github.event.client_payload.service }}.${{ env.K8S_NAMESPACE }}.svc.cluster.local \
            --html locust-report.html
        working-directory: locust/${{ github.event.client_payload.service }}
