replicaCount: 1

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: /actuator/prometheus

image:
  repository: ""  # set at deploy time by GHA: --set image.repository=<registry>/circleguard
  pullPolicy: IfNotPresent
  tag: ""  # Overridden by pipeline: --set image.tag=<service>-sha-<commit>

service:
  type: ClusterIP
  port: 8081

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 12

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 0
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 20
  periodSeconds: 5

env:
  JAVA_TOOL_OPTIONS: "-Xmx192m -Xms128m -XX:+UseContainerSupport"
  DB_HOST: "postgres"
  DB_NAME: "circleguard_auth"
  LDAP_HOST: "openldap"
  IDENTITY_SERVICE_URL: "http://identity-service:8082"
  # Circuit Breaker tuning — External Configuration Store pattern (adjust per-env without rebuild)
  CIRCUIT_BREAKER_FAILURE_RATE: "50"
  CIRCUIT_BREAKER_WAIT_DURATION: "10s"
  CIRCUIT_BREAKER_SLIDING_WINDOW_SIZE: "10"
  # JWT / token tuning
  JWT_EXPIRATION_MS: "3600000"

envFrom:
  - secretRef:
      name: auth-service-secret
      # Keys expected: DB_USERNAME, DB_PASSWORD, JWT_SECRET
